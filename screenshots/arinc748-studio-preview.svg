<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#070b14; font-family:'SF Mono', 'Roboto Mono', monospace;">
  <rect x="0" y="0" width="1000" height="50" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="32" fill="#00f0ff" font-size="16" font-weight="bold" letter-spacing="1">ARINC748FORGE PRO</text>
  <rect x="210" y="16" width="95" height="20" rx="3" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff"/>
  <text x="257" y="30" fill="#00f0ff" font-size="10" font-weight="bold" text-anchor="middle">v1.0.0 STABLE</text>
  <rect x="315" y="16" width="180" height="20" rx="3" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
  <text x="405" y="30" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">ARINC 748 MLS CERTIFIED</text>
  <text x="976" y="32" fill="#94a3b8" font-size="11" text-anchor="end">RECORD #404 | EGLL 27R</text>

  <!-- Left Main Area: PFD Cross-Pointer & TRSB Oscilloscope -->
  <rect x="20" y="65" width="630" height="340" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <text x="36" y="92" fill="#00f0ff" font-size="13" font-weight="bold">🛬 PRIMARY FLIGHT DISPLAY (PFD) MLS CROSS-POINTER &amp; TRSB TIMING</text>

  <!-- PFD Cross Pointer Box -->
  <rect x="36" y="105" width="280" height="220" rx="6" fill="#050811" stroke="#1e293b"/>
  <!-- Horizon -->
  <rect x="46" y="115" width="260" height="100" fill="#1e40af"/>
  <rect x="46" y="215" width="260" height="100" fill="#78350f"/>
  <line x1="46" y1="215" x2="306" y2="215" stroke="#ffffff" stroke-width="2"/>
  <!-- Aircraft Cross -->
  <line x1="150" y1="215" x2="166" y2="215" stroke="#f59e0b" stroke-width="3"/>
  <line x1="186" y1="215" x2="202" y2="215" stroke="#f59e0b" stroke-width="3"/>
  <line x1="176" y1="205" x2="176" y2="225" stroke="#f59e0b" stroke-width="3"/>

  <!-- Azimuth Dots -->
  <circle cx="106" cy="295" r="3" fill="#64748b"/>
  <circle cx="141" cy="295" r="3" fill="#64748b"/>
  <circle cx="211" cy="295" r="3" fill="#64748b"/>
  <circle cx="246" cy="295" r="3" fill="#64748b"/>
  <!-- Azimuth Needle (Magenta) -->
  <polygon points="166,288 171,295 166,302 161,295" fill="#d946ef"/>

  <!-- Elevation Dots -->
  <circle cx="280" cy="145" r="3" fill="#64748b"/>
  <circle cx="280" cy="180" r="3" fill="#64748b"/>
  <circle cx="280" cy="250" r="3" fill="#64748b"/>
  <circle cx="280" cy="285" r="3" fill="#64748b"/>
  <!-- Elevation Needle (Magenta) -->
  <polygon points="280,228 285,223 280,218 275,223" fill="#d946ef"/>

  <!-- TRSB Oscilloscope Container -->
  <rect x="330" y="105" width="305" height="105" rx="6" fill="#090e1a" stroke="#1e293b"/>
  <text x="342" y="125" fill="#00f0ff" font-size="9" font-weight="bold">TRSB SCANNING BEAM PULSE OSCILLOSCOPE</text>
  <text x="342" y="145" fill="#94a3b8" font-size="8">SCANNING VELOCITY: <tspan fill="#ffffff" font-weight="bold">20,000 °/s (50 µs/deg)</tspan></text>
  <text x="342" y="162" fill="#94a3b8" font-size="8">AZIMUTH DELTA-T: <tspan fill="#10b981" font-weight="bold">4,845.0 µs</tspan> (T0: 4800 µs)</text>
  <text x="342" y="179" fill="#94a3b8" font-size="8">ELEVATION DELTA-T: <tspan fill="#10b981" font-weight="bold">3,038.0 µs</tspan> (T0: 3350 µs)</text>
  <text x="342" y="196" fill="#94a3b8" font-size="8">BEAM LOCK: <tspan fill="#10b981" font-weight="bold">AZ &amp; EL LOCKED (&gt; 37 dB SNR)</tspan></text>

  <!-- Ground Station Tuning & Channel Box -->
  <rect x="330" y="220" width="305" height="105" rx="6" fill="#090e1a" stroke="#1e293b"/>
  <text x="342" y="240" fill="#00f0ff" font-size="9" font-weight="bold">C-BAND TUNER &amp; APPROACH GEOMETRY</text>
