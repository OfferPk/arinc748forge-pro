  <rect x="20" y="420" width="630" height="210" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <text x="36" y="445" fill="#00f0ff" font-size="12" font-weight="bold">⚡ REAL-TIME APPROACH DYNAMICS &amp; DDM TELEMETRY</text>

  <!-- Telemetry Row -->
  <rect x="36" y="465" width="138" height="65" rx="4" fill="#090e1a" stroke="#1e293b"/>
  <text x="46" y="482" fill="#64748b" font-size="8">AZIMUTH DEV</text>
  <text x="46" y="502" fill="#00f0ff" font-size="12" font-weight="bold">-0.035 DDM</text>
  <text x="46" y="518" fill="#10b981" font-size="8">-0.45° (LEFT)</text>

  <rect x="184" y="465" width="138" height="65" rx="4" fill="#090e1a" stroke="#1e293b"/>
  <text x="194" y="482" fill="#64748b" font-size="8">ELEVATION DEV</text>
  <text x="194" y="502" fill="#00f0ff" font-size="12" font-weight="bold">+0.030 DDM</text>
  <text x="194" y="518" fill="#10b981" font-size="8">+0.12° (ABOVE)</text>

  <rect x="332" y="465" width="138" height="65" rx="4" fill="#090e1a" stroke="#1e293b"/>
  <text x="342" y="482" fill="#64748b" font-size="8">DME/P RANGE</text>
  <text x="342" y="502" fill="#00f0ff" font-size="12" font-weight="bold">3.80 NM</text>
  <text x="342" y="518" fill="#10b981" font-size="8">PRECISION DME</text>

  <rect x="480" y="465" width="154" height="65" rx="4" fill="#090e1a" stroke="#1e293b"/>
