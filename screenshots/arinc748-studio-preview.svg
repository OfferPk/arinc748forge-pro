  <text x="46" y="560" fill="#00f0ff" font-size="9" font-weight="bold">MLS TRSB GROUND TRANSMITTER: EGLL RWY 27R — 5046.0 MHz (C-BAND MICROWAVE)</text>
  <text x="46" y="575" fill="#94a3b8" font-size="8">PROPORTIONAL GUIDANCE: AZIMUTH ±40.0° SECTOR | ELEVATION 0.9° TO 20.0°</text>
  <text x="46" y="590" fill="#10b981" font-size="8">CURVED APPROACH SEGMENTATION READY | ZERO GROUND MULTIPATH BENDS | CAT III CERTIFIED</text>

