  <rect x="670" y="65" width="310" height="240" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <text x="686" y="92" fill="#00f0ff" font-size="12" font-weight="bold">🎛️ ARINC 429 DISCRETE BUS STREAM</text>

