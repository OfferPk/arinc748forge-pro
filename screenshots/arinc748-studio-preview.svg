    <text x="880" y="122" fill="#ffffff">0x07E12030</text>
    <text x="955" y="122" fill="#10b981" font-weight="bold" text-anchor="end">OK</text>

    <rect x="686" y="136" width="278" height="26" rx="3" fill="#090e1a" stroke="#1e293b"/>
