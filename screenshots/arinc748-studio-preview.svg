    <text x="955" y="427" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>

    <rect x="686" y="438" width="278" height="22" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="453" fill="#e2e8f0">CHK-04: Proportional Elevation Coverage (0.9°-20°)</text>
    <text x="955" y="453" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>

    <rect x="686" y="464" width="278" height="22" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="479" fill="#e2e8f0">CHK-05: Azimuth Deviation DDM Scaling</text>
    <text x="955" y="479" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>

    <rect x="686" y="490" width="278" height="22" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="505" fill="#e2e8f0">CHK-06: Elevation Deviation DDM Scaling (3.0°)</text>
    <text x="955" y="505" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>

    <rect x="686" y="516" width="278" height="22" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="531" fill="#e2e8f0">CHK-07: DME/P Precision Ranging Accuracy (&lt; 30m)</text>
    <text x="955" y="531" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>

    <rect x="686" y="542" width="278" height="22" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="557" fill="#e2e8f0">CHK-08: Auxiliary Data CRC Integrity Verification</text>
    <text x="955" y="557" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>

    <rect x="686" y="568" width="278" height="22" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="583" fill="#e2e8f0">CHK-09: ARINC 429 Discrete Labels 060-064</text>
    <text x="955" y="583" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>

    <rect x="686" y="594" width="278" height="22" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="609" fill="#e2e8f0">CHK-10: Bit 32 Odd Parity Hardware Verification</text>
    <text x="955" y="609" fill="#10b981" font-weight="bold" text-anchor="end">PASS</text>
