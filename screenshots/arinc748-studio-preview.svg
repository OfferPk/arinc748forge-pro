  <text x="342" y="277" fill="#94a3b8" font-size="8">C-BAND CHANNEL: <tspan fill="#ffffff" font-weight="bold">CH 550 (5046.0 MHz)</tspan></text>
  <text x="342" y="294" fill="#94a3b8" font-size="8">GLIDEPATH: <tspan fill="#ffffff" font-weight="bold">3.00°</tspan> | DME/P: <tspan fill="#10b981" font-weight="bold">3.80 NM</tspan></text>
  <text x="342" y="311" fill="#94a3b8" font-size="8">STATUS: <tspan fill="#10b981" font-weight="bold">FULL TRSB AUTOLAND (CAT III ACTIVE)</tspan></text>

