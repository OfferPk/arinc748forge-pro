    <text x="880" y="184" fill="#ffffff">0xFFE28032</text>
    <text x="955" y="184" fill="#10b981" font-weight="bold" text-anchor="end">OK</text>

    <rect x="686" y="198" width="278" height="26" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="215" fill="#00f0ff">LABEL 063 — Elevation Deviation DDM</text>
    <text x="880" y="215" fill="#ffffff">0x003C4033</text>
    <text x="955" y="215" fill="#10b981" font-weight="bold" text-anchor="end">OK</text>

    <rect x="686" y="229" width="278" height="26" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="246" fill="#00f0ff">LABEL 064 — DME/P Precision Range</text>
    <text x="880" y="246" fill="#ffffff">0x07998034</text>
    <text x="955" y="246" fill="#10b981" font-weight="bold" text-anchor="end">OK</text>

    <rect x="686" y="260" width="278" height="26" rx="3" fill="#090e1a" stroke="#1e293b"/>
    <text x="696" y="277" fill="#00f0ff">LABEL 273 — Azimuth Sector Limit (±40°)</text>
    <text x="880" y="277" fill="#ffffff">0x0A0000BB</text>
    <text x="955" y="277" fill="#10b981" font-weight="bold" text-anchor="end">OK</text>
